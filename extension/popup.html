<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>PlayCanvas Agent Bridge</title>
    <style>
      body {
        color: #1f2937;
        font: 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        min-width: 320px;
        padding: 14px;
      }

      h1 {
        font-size: 15px;
        margin: 0 0 10px;
      }

      dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 6px 10px;
        margin: 0;
      }

      dt {
        color: #6b7280;
      }

      dd {
        margin: 0;
        word-break: break-all;
      }

      .actions {
        display: grid;
        gap: 8px;
        grid-template-columns: 1fr 1fr;
        margin-top: 14px;
      }

      button {
        background: #2563eb;
        border: 0;
        border-radius: 5px;
        color: white;
        cursor: pointer;
        font: inherit;
        padding: 8px;
      }

      button.secondary {
        background: #4b5563;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }

      #message {
        color: #6b7280;
        line-height: 1.4;
        margin: 10px 0 0;
      }
    </style>
  </head>
  <body>
    <h1>PlayCanvas Agent Bridge</h1>
    <dl>
      <dt>Daemon</dt>
      <dd id="daemon">Loading</dd>
      <dt>Tab</dt>
      <dd id="tab">Loading</dd>
      <dt>Frontend</dt>
      <dd id="frontend">Loading</dd>
      <dt>Mode</dt>
      <dd id="mode">Loading</dd>
    </dl>
    <div class="actions">
      <button id="use-custom" type="button">Use custom frontend</button>
      <button id="use-official" class="secondary" type="button">Use official frontend</button>
    </div>
    <p id="message"></p>
    <script src="popup.js"></script>
  </body>
</html>
